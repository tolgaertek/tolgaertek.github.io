    <h2>İletişim Formu</h2>

    <form action="#" method="post">
        
        <label for="adSoyad">Ad Soyad:</label><br>
        <input type="text" id="adSoyad" name="adSoyad" placeholder="Adınızı ve soyadınızı giriniz"><br><br>

        <label for="email">E-posta Adresi:</label><br>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com"><br><br>

        <label for="konu">Konu:</label><br>
        <select id="konu" name="konu">
            <option value="is_teklifi">İş Teklifi</option>
            <option value="soru">Soru / Öneri</option>
            <option value="diger">Diğer</option>
        </select><br><br>

        <label for="dosya">Dosya Yükle (CV veya Fotoğraf):</label><br>
        <input type="file" id="dosya" name="dosya"><br><br>

        <label for="mesaj">Mesajınız:</label><br>
        <textarea id="mesaj" name="mesaj" rows="5" cols="40" placeholder="Mesajınızı buraya yazabilirsiniz..."></textarea><br><br>

        <input type="submit" value="GÖNDER">
        
    </form>
